name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The no-egress test is the point of this project; run it first and loudly.
      - name: no-egress guarantee
        run: pytest tests/test_no_egress.py -v
      - name: unit tests
        run: pytest -q
      - name: detector scorecard
        run: python eval/score.py
