name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      # The no-egress test is the point of this project; run it first and loudly.
      - name: no-egress guarantee
        run: pytest tests/test_no_egress.py -v
      - name: unit tests
        run: pytest -q
      # Layer 1 only: CI does not install spaCy or its ~600MB model, so the
      # NER/LLM labels (PERSON, ORG, ADDRESS) are out of reach here. But the
      # validator-backed labels are pure layer 1 and must never leak -- gate
      # on that so "structured PII does not survive redaction" is enforced,
      # not just measured. This property is stable as the corpus grows.
      - name: detector scorecard + leak gate
        run: >
          python eval/score.py --no-ner
          --fail-on-leak SSN,CREDIT_CARD,IBAN,EMAIL,PHONE_US,IPV4,DOB