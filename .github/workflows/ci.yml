name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The no-egress test is the point of this project; run it first and loudly.
      - name: no-egress guarantee
        run: pytest tests/test_no_egress.py -v
      - name: unit tests
        run: pytest -q
      # Layer 1 only: CI does not install spaCy or its ~600MB model. The
      # scorecard here is a smoke test that the eval harness still runs, not
      # a measure of full detector quality.
      - name: detector scorecard
        run: python eval/score.py --no-ner