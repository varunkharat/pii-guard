[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piiguard"
version = "0.1.0"
description = "Local-first PII detection and redaction. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Layer 2. Installed explicitly so the base tool stays dependency-free.
ner = ["spacy>=3.7"]
# Layer 3 has no Python dependency: the Ollama client uses stdlib http.client
# through the loopback guard in localnet.py. It needs only a running Ollama
# server, not a pip install.
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
piiguard = "piiguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
